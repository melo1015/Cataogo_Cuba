name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/catalogo_cuba/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r apps/catalogo_cuba/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q apps/catalogo_cuba
