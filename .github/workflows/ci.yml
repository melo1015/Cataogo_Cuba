name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/catalogo_cuba/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r apps/catalogo_cuba/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q apps/catalogo_cuba
      - name: Import application smoke test
        env:
          CATALOGO_CUBA_DEBUG: "1"
          PYTHONPATH: apps
        run: python -c "import catalogo_cuba; print('CatalogoCuba import OK')"
      - name: Check service worker JavaScript syntax
        run: node --check apps/catalogo_cuba/static/sw.js
      - name: Check public catalog template JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          template = Path("apps/catalogo_cuba/templates/catalogo_negocio.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script\\s*>", template, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No inline script found in catalogo_negocio.html")
          javascript = "\\n".join(scripts)
          if re.search(r"\\.innerHTML\\s*=", javascript):
              raise SystemExit("Unsafe innerHTML assignment found in public catalog template")
          Path("/tmp/catalogo_negocio_inline.js").write_text(javascript, encoding="utf-8")
          PY
          node --check /tmp/catalogo_negocio_inline.js
      - name: Run application schema and database-flow tests
        env:
          CATALOGO_CUBA_DEBUG: "1"
          CATALOGO_CUBA_DB_URI: "sqlite://catalogo_cuba_ci.db"
          PYTHONPATH: apps
        run: python -m unittest discover -s apps/catalogo_cuba/tests -v
