# Incluir este archivo dentro del contexto http {} de Nginx.
# En Debian/Ubuntu, /etc/nginx/conf.d/*.conf suele cargarse dentro de http {}.
# No incluirlo dentro de un bloque server {}.
limit_req_zone $binary_remote_addr zone=catalogo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=catalogo_orders:10m rate=2r/s;
# Limita intentos de login, registro y recuperación de contraseña.
limit_req_zone $binary_remote_addr zone=catalogo_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=catalogo_per_ip:10m;

# No registrar cuerpos de petición ni tokens en los logs de acceso.
